<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcul Tarifs Métaux Précieux</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --bg-primary: #ffffff; --bg-secondary: #f5f5f7;
            --text-primary: #000000; --text-secondary: #666666;
            --border-color: #e0e0e0; --accent: #0071e3;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        body.dark-mode {
            --bg-primary: #1d1d1f; --bg-secondary: #2d2d2f;
            --text-primary: #ffffff; --text-secondary: #a1a1a6;
            --border-color: #424245;
        }
        body { font-family: var(--font-family); background: var(--bg-primary); color: var(--text-primary); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .tabs { border-bottom: 1px solid var(--border-color); margin-bottom: 20px; }
        .tab-button { background: none; border: none; padding: 10px 20px; cursor: pointer; color: var(--text-secondary); font-weight: 600; }
        .tab-button.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 200px; }
        label { display: block; font-size: 12px; margin-bottom: 5px; font-weight: 600; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-secondary); color: var(--text-primary); }
        .field-group { display: none; background: var(--bg-secondary); padding: 15px; border-radius: 10px; margin-top: 10px; }
        .field-group.active { display: block; }
        button { background: var(--accent); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: 600; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: var(--bg-secondary); border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid var(--border-color); }
        th { background: #000; color: #fff; font-size: 11px; text-transform: uppercase; }
        .toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 24px; border-radius: 8px; color: white; z-index: 100; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h3>CALCUL TARIFS BARRES ET RONDELLES</h3>
            <button onclick="toggleDarkMode()" style="width: auto;">🌓 Mode</button>
        </div>

        <div class="tabs">
            <button class="tab-button active" onclick="showTab('calcul')">Calcul</button>
            <button class="tab-button" onclick="showTab('resultats')">Résultats</button>
        </div>

        <div id="calcul" class="tab-content active">
            <div class="form-row">
                <div class="form-group"><label>Référence</label><input type="text" id="reference"></div>
                <div class="form-group"><label>Marge (%)</label><input type="number" id="marge" value="10"></div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Type de pièce</label>
                    <select id="typePiece" onchange="updateFields()">
                        <option value="">Sélectionnez</option>
                        <option value="barresRect">Barres rectangulaires</option>
                        <option value="barresRondes">Barres rondes</option>
                        <option value="tubes">Tube</option>
                        <option value="rondelles">Rondelles</option>
                        <option value="plaques">Plaques</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Alliage</label>
                    <select id="alliage">
                        <option value="OR GRIS 0125 / 5125">OR GRIS 0125 / 5125</option>
                        <option value="OR GRIS 0150 / 5150">OR GRIS 0150 / 5150</option>
                        <option value="OR ROSE 5N / 500">OR ROSE 5N / 500</option>
                        <option value="OR JAUNE 3N / 318">OR JAUNE 3N / 318</option>
                        <option value="PLATINE / PT801">PLATINE / PT801</option>
                    </select>
                </div>
            </div>

            <div id="barresRectFields" class="field-group">
                <div class="form-row">
                    <div class="form-group"><label>Larg (mm)</label><input type="number" id="largRect" step="0.01"></div>
                    <div class="form-group"><label>Haut (mm)</label><input type="number" id="hautRect" step="0.01"></div>
                    <div class="form-group"><label>Long utile (mm)</label><input type="number" id="longRect" step="0.01"></div>
                </div>
            </div>

            <div id="barresRondesFields" class="field-group">
                <div class="form-row">
                    <div class="form-group"><label>Diamètre (mm)</label><input type="number" id="diamRond" step="0.01"></div>
                    <div class="form-group"><label>Long utile (mm)</label><input type="number" id="longRond" step="0.01"></div>
                </div>
            </div>

            <button onclick="executerCalcul()" style="margin-top: 20px;">CALCULER</button>
        </div>

        <div id="resultats" class="tab-content">
            <div id="zoneResultat"></div>
        </div>
    </div>

    <script>
        const densites = { 'OR GRIS 0125 / 5125': 15.9, 'OR GRIS 0150 / 5150': 15.8, 'OR ROSE 5N / 500': 15.4, 'OR JAUNE 3N / 318': 15.6, 'PLATINE / PT801': 21.4 };
        const surtitrages = { 'OR GRIS 0125 / 5125': 70, 'OR GRIS 0150 / 5150': 140, 'OR ROSE 5N / 500': 35, 'OR JAUNE 3N / 318': 42, 'PLATINE / PT801': 0 };
        
        const tarifs = {
            mise: { 'OR GRIS 0125 / 5125': {kg: 465, min:0}, 'PLATINE / PT801': {kg: 2368, min: 500}, default: {kg: 339, min: 0} },
            facon: { 'PLATINE / PT801': 0.8, default: 0.02 }
        };

        function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }
        function showTab(id) { document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active')); document.getElementById(id).classList.add('active'); }
        function updateFields() { document.querySelectorAll('.field-group').forEach(f => f.classList.remove('active')); const type = document.getElementById('typePiece').value; if(type) document.getElementById(type + 'Fields').classList.add('active'); }

        function calculerDechetBarre(lgUtileXQte) {
            const baseBarre = 1440; const dechet = 60;
            return Math.ceil(lgUtileXQte / baseBarre) * dechet;
        }

        function executerCalcul() {
            const type = document.getElementById('typePiece').value;
            const alliage = document.getElementById('alliage').value;
            const marge = parseFloat(document.getElementById('marge').value) || 0;
            const densite = densites[alliage];
            
            if(!type) return alert("Sélectionnez un type");

            let sectionMM2 = 0;
            let longUtileUnit = 0;

            if(type === 'barresRect') {
                sectionMM2 = (parseFloat(document.getElementById('largRect').value) || 0) * (parseFloat(document.getElementById('hautRect').value) || 0);
                longUtileUnit = parseFloat(document.getElementById('longRect').value) || 0;
            } else if(type === 'barresRondes') {
                const d = parseFloat(document.getElementById('diamRond').value) || 0;
                sectionMM2 = Math.PI * Math.pow(d/2, 2);
                longUtileUnit = parseFloat(document.getElementById('longRond').value) || 0;
            }

            const facteurs = [1, 3, 5, 10, 20, 50];
            let html = `<table><tr><th>Quantité</th><th>Poids (g)</th><th>Prix Total (CHF)</th><th>Prix/pc</th></tr>`;

            facteurs.forEach(qte => {
                const lgTotUtile = longUtileUnit * qte;
                const dechet = calculerDechetBarre(lgTotUtile);
                const lgFacturee = lgTotUtile + dechet;

                // Calcul Volume en mm3 -> conversion cm3 et kg direct
                const poidsKg = (sectionMM2 * lgFacturee * densite) / 1000000;
                
                const tMise = tarifs.mise[alliage] || tarifs.mise.default;
                const fMise = Math.max(poidsKg * tMise.kg, tMise.min);
                const fFacon = lgFacturee * (tarifs.facon[alliage] || tarifs.facon.default);
                const fSurtitrage = poidsKg * (surtitrages[alliage] || 0);
                
                const totalHT = fMise + fFacon + fSurtitrage;
                const totalTTC = totalHT * (1 + marge/100);

                html += `<tr>
                    <td>${qte} PC</td>
                    <td>${(poidsKg * 1000).toFixed(2)}g</td>
                    <td>${totalTTC.toFixed(2)}</td>
                    <td>${(totalTTC / qte).toFixed(2)}</td>
                </tr>`;
            });

            html += `</table>`;
            document.getElementById('zoneResultat').innerHTML = html;
            showTab('resultats');
        }
    </script>
</body>
</html>
